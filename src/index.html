<!doctype html>
<html lang="en">
  <head>
    <title>Music Player</title>
  </head>
  <body>
    <div class="dashboard">
      <header class="header">
        <h2 class="song-title">
          Now Playing:
          <span id="song-title">Song name</span>
        </h2>
        <img src="example" alt="thumbnail" class="thumbnail" />
      </header>
      <main class="song-controller">
        <audio id="player" src="" controls>
        </audio>
        <!-- Progress bar -->
        <div class="song-progress">
          <span id="current-time">0:00</span>
          <input type="range" id="progress-bar" value="0" max="100" />
          <span id="duration">1:00</span>
        </div>

        <!-- button controller  -->
        <div class="buttons-controller">
          <button id="prev-btn"><i data-lucide="skip-back">skip</i></button>
          <button id="play-pause-btn"><i data-lucide="play">play</i></button>
          <button id="next-btn"><i data-lucide="skip-forward"></i></button>
          <button id="random-btn"><i data-lucide="shuffle">shuffle</i></button>

          <!-- Volume control -->
          <div class="volume-control">
            <button id="mute-btn"><i data-lucide="volume-1"></i></button>
            <input
              type="range"
              id="volume-bar"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
          </div>
        </div>
      </main>

      <!-- Footer, list song -->
      <footer class="footer">
        <ul class="playlist">
          <li>Song 1 - Singer</li>
          <li>Song 2 - Singer</li>
          <li>Song 3 - Singer</li>
        </ul>
      </footer>
    </div>

    <!-- bottom for android -->
    <nav class="bottom-bar">
      <button>Home</button>
      <button>Search</button>
      <button>Library</button>
      <button>Settings</button>
    </nav>
  </body>
</html>
